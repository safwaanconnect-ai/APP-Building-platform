apiVersion: v1
kind: Service
metadata:
  name: saas-builder-backend-service
  namespace: saas-builder
  labels:
    app: saas-builder
    component: backend
spec:
  selector:
    app: saas-builder
    component: backend
  ports:
  - protocol: TCP
    port: 3001
    targetPort: 3001
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: saas-builder-frontend-service
  namespace: saas-builder
  labels:
    app: saas-builder
    component: frontend
spec:
  selector:
    app: saas-builder
    component: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: saas-builder-postgres-service
  namespace: saas-builder
  labels:
    app: saas-builder
    component: postgres
spec:
  selector:
    app: saas-builder
    component: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: saas-builder-redis-service
  namespace: saas-builder
  labels:
    app: saas-builder
    component: redis
spec:
  selector:
    app: saas-builder
    component: redis
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-builder-ingress
  namespace: saas-builder
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - yourdomain.com
    - api.yourdomain.com
    secretName: saas-builder-tls
  rules:
  - host: yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: saas-builder-frontend-service
            port:
              number: 80
  - host: api.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: saas-builder-backend-service
            port:
              number: 3001