apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-builder-backend
  namespace: saas-builder
  labels:
    app: saas-builder
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: saas-builder
      component: backend
  template:
    metadata:
      labels:
        app: saas-builder
        component: backend
    spec:
      containers:
      - name: backend
        image: saas-builder/backend:latest
        ports:
        - containerPort: 3001
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: saas-builder-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: saas-builder-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: saas-builder-secrets
              key: jwt-secret
        - name: NODE_ENV
          value: "production"
        - name: FRONTEND_URL
          value: "https://yourdomain.com"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: saas-builder-uploads-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: saas-builder-logs-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-builder-frontend
  namespace: saas-builder
  labels:
    app: saas-builder
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: saas-builder
      component: frontend
  template:
    metadata:
      labels:
        app: saas-builder
        component: frontend
    spec:
      containers:
      - name: frontend
        image: saas-builder/frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: VITE_API_URL
          value: "https://api.yourdomain.com"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-builder-postgres
  namespace: saas-builder
  labels:
    app: saas-builder
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saas-builder
      component: postgres
  template:
    metadata:
      labels:
        app: saas-builder
        component: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: saas-builder-secrets
              key: postgres-db
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: saas-builder-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: saas-builder-secrets
              key: postgres-password
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - saas_builder_user
            - -d
            - saas_builder_db
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - saas_builder_user
            - -d
            - saas_builder_db
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: saas-builder-postgres-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-builder-redis
  namespace: saas-builder
  labels:
    app: saas-builder
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saas-builder
      component: redis
  template:
    metadata:
      labels:
        app: saas-builder
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
        - redis-server
        - --appendonly
        - "yes"
        - --requirepass
        - "$(REDIS_PASSWORD)"
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: saas-builder-secrets
              key: redis-password
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: saas-builder-redis-pvc